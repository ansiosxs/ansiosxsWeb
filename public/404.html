<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Ansiosxs – Nuevas Lecturas</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment,
      // e.g. https://www.foo.tld/one/two?a=b&c=d#qwe, becomes
      // https://www.foo.tld/?p=/one/two&q=a=b&c=d#qwe
      // Note: this 404.html file must be at least 512 bytes for it to work
      // with Internet Explorer (it is currently > 512 bytes)

      // If you're creating a Project Pages site and NOT using a custom domain,
      // then set pathSegmentsToKeep to 1 (enterprise users may need to set it to > 1).
      // This way the code will only replace the path part after the project name.
      // For example, if your site is at https://your.github.io/my-project/,
      // then pathSegmentsToKeep should be 1 (enterprise users may need to set it to > 1).
      // The way to figure out your pathSegmentsToKeep is:
      // 1. Go to your GitHub Pages site in your browser
      // 2. Look at the URL in the address bar
      // 3. Count the number of segments after the domain (including the project name)
      // 4. Set pathSegmentsToKeep to that number
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '%26') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '%26') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
